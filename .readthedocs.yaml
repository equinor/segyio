# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - build-essential
    - cmake
  jobs:
    post_install:
      - cmake -S . -B build -DBUILD_PYTHON=ON -DBUILD_BIN=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$READTHEDOCS_VIRTUALENV_PATH"
      - cmake --build build --parallel 2
      - cmake --install build

sphinx:
  configuration: python/docs/conf.py

python:
  install:
    - requirements: requirements-readthedocs.txt
