name: Run analyzers
permissions: {}

on:
  push:
    branches: [segyio-1.x]
  pull_request:
    branches: [segyio-1.x]
  workflow_dispatch:

jobs:
  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install cppcheck

      - name: Configure
        run: |
          cmake -S . -B build                     \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON    \
            -DBUILD_PYTHON=OFF                    \
            -DBUILD_TESTING=OFF

      - name: Run cppcheck
        run: |
          cppcheck                                          \
            --enable=style,portability,performance,warning  \
            --library=posix                                 \
            --library=cppcheck/segyio.cfg                   \
            --suppressions-list=cppcheck/suppressions.txt   \
            --inline-suppr                                  \
            --project=build/compile_commands.json           \
            --error-exitcode=1                              \
            --check-level=exhaustive

  scan_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install clang clang-tools libfindbin-libs-perl

      - name: Configure segyio
        run: |
          scan-build --status-bugs   \
            cmake                    \
            -S .                     \
            -B build                 \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_PYTHON=OFF       \
            -DBUILD_TESTING=OFF

      - name: Run scan-build
        run: |
          scan-build --status-bugs \
            cmake                  \
            --build build

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build segyio with ASAN
        run: |
          cmake -S . -B build           \
          -DCMAKE_BUILD_TYPE=Debug      \
          -DCMAKE_C_FLAGS_DEBUG="-g -O1 -fsanitize=address -fno-omit-frame-pointer"   \
          -DCMAKE_CXX_FLAGS_DEBUG="-g -O1 -fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address" \
          -DBUILD_SHARED_LIBS=ON        \
          -DBUILD_PYTHON=OFF
          cmake --build build

      - name: Run ASAN on C tests, file
        working-directory: build/lib
        run: |
          ./c.segy "[c.segy]"

      - name: Run ASAN on C tests, mmap
        working-directory: build/lib
        run: |
          ./c.segy "[c.segy]" "--test-mmap"

      - name: Run ASAN on C++ tests
        working-directory: build/lib
        run: |
          ./c.segy "[c++]"

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install valgrind

      - name: Build segyio
        run: |
          cmake -S . -B build           \
            -DCMAKE_BUILD_TYPE=Debug      \
            -DCMAKE_C_FLAGS_DEBUG="-g -O0"   \
            -DCMAKE_CXX_FLAGS_DEBUG="-g -O0" \
            -DBUILD_SHARED_LIBS=ON        \
            -DBUILD_PYTHON=OFF
          cmake --build build

      - name: Run valgrind on C tests, file
        working-directory: build/lib
        run: |
          valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./c.segy "[c.segy]"

      - name: Run valgrind on C tests, mmap
        working-directory: build/lib
        run: |
          valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./c.segy "[c.segy]" "--test-mmap"

      - name: Run valgrind on C++ tests
        working-directory: build/lib
        run: |
          valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./c.segy "[c++]"

  valgrind-python-invalid-memory-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install valgrind

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build/test dependencies
        working-directory: python
        run: |
          python -m pip install -r requirements-dev.txt

      - name: Configure
        run: |
          cmake -S . -B build \
            -DBUILD_PYTHON=ON \
            -DBUILD_TESTING=OFF \
            -DBUILD_BIN=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG="-g -O0" \
            -DCMAKE_CXX_FLAGS_DEBUG="-g -O0" \
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: |
          cmake --build build

      - name: Run valgrind memcheck on default pytests
        run: |
          cd python
          # test_no_16bit_overflow_tracecount is too large for valgrind, so skip
          # only "invalid memory access" checks. "Memory leaks" would be caused by python anyway.
          valgrind --tool=memcheck --error-exitcode=1 pytest -rPV -k 'not test_no_16bit_overflow_tracecount'
